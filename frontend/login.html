<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Transmetro</title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>

<body class="login-body">

    <!-- LOGIN -->

    <div class="login-container">

        <!-- LOGO -->

        <div class="login-logo">

            <img
                src="logo.png"
                alt="Transmetro"
            >

        </div>

        <!-- HEADER -->

        <div class="login-header">

            <h1>
                Transmetro
            </h1>

            <p>
                Sistema de Gestión y Control
            </p>

        </div>

        <!-- FORM -->

        <form
            class="login-form"
            onsubmit="login(event)"
        >

            <div class="input-group">

                <label>
                    Usuario
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Ingrese usuario"
                    required
                >

            </div>

            <div class="input-group">

                <label>
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Ingrese contraseña"
                    required
                >

            </div>

            <button type="submit">
                Ingresar
            </button>

            <p
                id="mensaje"
                class="mensaje"
            ></p>

        </form>

    </div>

    <script>

    async function login(event){

            event.preventDefault();

            const nombre =
                document.getElementById(
                    "nombre"
                ).value;

            const password =
                document.getElementById(
                    "password"
                ).value;

            try{

                const respuesta =
                    await fetch(
                        "https://sistema-transmetro-9g8y.onrender.com/login",
                        {
                            method:"POST",

                            headers:{
                                "Content-Type":
                                "application/json"
                            },

                            body:JSON.stringify({
                                nombre,
                                password
                            })
                        }
                    );

                const data =
                    await respuesta.json();

                if(data.success){
                    localStorage.setItem(
                        "usuarioLogueado",
                        JSON.stringify(
                            data.usuario
                        )
                    );
                    
                    window.location.href =
                    "index.html";
                
                }else{

                    document.getElementById(
                        "mensaje"
                    ).innerText =
                        "Credenciales incorrectas";
                }

            }catch(error){

                document.getElementById(
                    "mensaje"
                ).innerText =
                    "Error de conexión";
            }
        }

    </script>

</body>

</html>
