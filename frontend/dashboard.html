

<!DOCTYPE html>
<html lang="es">

<script>
if(!localStorage.getItem("usuarioLogueado")){
    window.location.href = "index.html";
}
</script>

<head>
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Transmetro Dashboard</title>

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

    <!-- CHART JS -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <img
                src="logo.png"
                alt="Transmetro"
            >

        </div>

        <nav>

            <ul>

                <li onclick="mostrarDashboard()">
                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard
                </li>

                <li onclick="mostrarBuses()">
                    <i class="fa-solid fa-bus"></i>
                    Buses
                </li>

                <li onclick="mostrarPilotos()">
                    <i class="fa-solid fa-user-tie"></i>
                    Pilotos
                </li>

                <li onclick="mostrarLineas()">
                    <i class="fa-solid fa-route"></i>
                    Líneas
                </li>

                <li onclick="mostrarEstaciones()">
                    <i class="fa-solid fa-building"></i>
                    Estaciones
                </li>

                <li onclick="mostrarParqueos()">
                    <i class="fa-solid fa-square-parking"></i>
                    Parqueos
                </li>

                <li onclick="mostrarAccesos()">
                    <i class="fa-solid fa-door-open"></i>
                    Accesos
                </li>

                <li onclick="mostrarGuardias()">
                    <i class="fa-solid fa-shield-halved"></i>
                    Guardias
                </li>

                <li onclick="mostrarAlertas()">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    Alertas
                </li>

                <li onclick="mostrarUsuarios()">
                    <i class="fa-solid fa-users"></i>
                    Usuarios
                </li>

                <li onclick="mostrarMunicipalidades()">
                    <i class="fa-solid fa-city"></i>
                     Municipalidades
                </li>

                <!--<li onclick="mostrarRutas()">
                    <i class="fa-solid fa-road"></i>
                    Rutas
                </li>-->

                <li onclick="mostrarMapa()">
                    <i class="fa-solid fa-map"></i>
                    Mapa
                </li>

                <li onclick="mostrarReportes()">
                    <i class="fa-solid fa-chart-column"></i>
                    Reportes
                </li>


                <li onclick="cerrarSesion()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Cerrar sesión
                </li>

            </ul>

        </nav>

        <div class="sidebar-footer">

            <img
                src="muni.png"
                alt="Municipalidad de Guatemala"
            >

        </div>

    </aside>

    <!-- MAIN -->

    <main class="main">

        <!-- TOPBAR -->

        <header class="topbar">

            <div>
                </div>

            <div class="topbar-right">

                <input
                    type="text"
                    id="buscador"
                    placeholder="Buscar..."
                    class="search"
                    onkeyup="buscarContenido()"
                >

                <div class="user">

                    <div class="avatar"
                        id="avatar"
                        >
                           A
                        </div>   
                    <div>

                        <h4 id="nombreUsuarioTopbar">
                            Usuario
                        </h4>

                        <span id="rolUsuarioTopbar">
                            Rol
                        </span>

                    </div>

                </div>

            </div>

        </header>

        <!-- CONTENIDO -->

        <section id="contenido">

        </section>

    </main>

    <!-- JS -->

    <script src="js/app.js"></script>

</body>

</html>
